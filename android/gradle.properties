# Keep Gradle within the available memory on development machines.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
# Avoid competing writers to plugin build folders on Windows/OneDrive.
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=false
org.gradle.vfs.watch=false
android.enableR8.fullMode=false
# kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
